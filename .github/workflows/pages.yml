name: Deploy demo a GitHub Pages
# Publica la build estática de la demo (sin backend) en GitHub Pages.
# La URL del proyecto será: https://FedericoIvanTravella.github.io/electro-cucin-/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/client/package-lock.json

      - name: Instalar y compilar la demo estática
        working-directory: FrontEnd/client
        env:
          VITE_DEMO: '1'
        run: |
          npm ci
          npm run build -- --base=/electro-cucin-/
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: FrontEnd/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
