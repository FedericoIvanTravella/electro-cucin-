# fly.toml app configuration file generated for electrocucine on 2026-11-19T00:22:37Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'electrocucine'
primary_region = 'gru'

[build]
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
